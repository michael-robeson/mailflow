name: Quality gates

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install quality-gate dependencies
        id: install
        run: npm ci
        continue-on-error: true
      - name: Check formatting
        id: format
        run: npm run format:check
        continue-on-error: true
      - name: Run ESLint
        id: lint
        run: npm run lint
        continue-on-error: true
      - name: Validate repository
        id: validation
        run: node scripts/validate.cjs
        continue-on-error: true
      - name: Run synthetic tests and collect coverage
        id: synthetic
        run: npm run test:coverage
        continue-on-error: true
      - name: Collect offline metrics
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          SYNTHETIC_OUTCOME: ${{ steps.synthetic.outcome }}
        run: node scripts/quality-dashboard.cjs collect-validate
      - name: Upload offline metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-metrics-validate
          path: coverage/quality-metrics-validate.json
      - name: Enforce offline quality gates
        if: always()
        run: node scripts/quality-dashboard.cjs enforce-validate

  postgres-persistence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch test images
        id: images
        run: |
          docker pull postgres:17.11-alpine
          docker pull docker.n8n.io/n8nio/n8n:2.47.4
        continue-on-error: true
      - name: Test persistence against isolated PostgreSQL
        id: integration
        if: always()
        run: npm run verify:postgres
        continue-on-error: true
      - name: Collect PostgreSQL metrics
        if: always()
        env:
          POSTGRES_IMAGES_OUTCOME: ${{ steps.images.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
        run: node scripts/quality-dashboard.cjs collect-postgres
      - name: Upload PostgreSQL metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-metrics-postgres
          path: coverage/quality-metrics-postgres.json
      - name: Enforce PostgreSQL quality gate
        if: always()
        run: node scripts/quality-dashboard.cjs enforce-postgres

  quality-dashboard:
    if: always()
    needs: [validate, postgres-persistence]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Download available metrics
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quality-metrics-*
          merge-multiple: true
          path: coverage/partials
        continue-on-error: true
      - name: Publish run summary and versioned metrics
        if: always()
        run: node scripts/quality-dashboard.cjs aggregate
      - name: Upload versioned engineering metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-quality-metrics-v1
          path: quality-metrics.json
