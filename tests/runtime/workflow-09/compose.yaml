services:
  n8n-postgres:
    image: postgres:17.11-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${W09_N8N_DB_PASSWORD:?Prepare the workflow 09 runtime first}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - runtime

  mailflow-postgres:
    image: postgres:17.11-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow_admin
      POSTGRES_PASSWORD: ${W09_APP_DB_ADMIN_PASSWORD:?Prepare the workflow 09 runtime first}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow_admin -d mailflow"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - persistence

  w09-gmail-mock:
    image: docker.n8n.io/n8nio/n8n:2.47.4
    pull_policy: never
    user: "${W09_RUNTIME_UID}:${W09_RUNTIME_GID}"
    entrypoint: ["node", "/runtime/gmail-fixture.cjs"]
    volumes:
      - ${W09_RUNTIME_DIR:?Prepare the workflow 09 runtime first}/gmail-fixture.cjs:/runtime/gmail-fixture.cjs:ro,z
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - runtime

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.4
    pull_policy: never
    user: "${W09_RUNTIME_UID}:${W09_RUNTIME_GID}"
    depends_on:
      n8n-postgres:
        condition: service_healthy
      mailflow-postgres:
        condition: service_healthy
      w09-gmail-mock:
        condition: service_healthy
    ports:
      - "127.0.0.1::5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${W09_N8N_DB_PASSWORD:?Prepare the workflow 09 runtime first}
      N8N_ENCRYPTION_KEY: ${W09_N8N_ENCRYPTION_KEY:?Prepare the workflow 09 runtime first}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: internal
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      NODE_FUNCTION_ALLOW_EXTERNAL: mailflow-pipeline
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - ${W09_RUNTIME_DIR:?Prepare the workflow 09 runtime first}/package:/usr/local/lib/node_modules/n8n/node_modules/mailflow-pipeline:ro,z
      - ${W09_RUNTIME_DIR:?Prepare the workflow 09 runtime first}/app-secret:/run/mailflow:ro,z
    tmpfs:
      - /home/node/.n8n:uid=${W09_RUNTIME_UID},gid=${W09_RUNTIME_GID},mode=0700
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz/readiness', r => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 60
    networks:
      - runtime
      - persistence

networks:
  runtime:
    internal: true
  persistence:
    internal: true
